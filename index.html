<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level UP - لوحة تحكم المحل (POS)</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --pri: #f59e0b; --txt: #f8fafc; --acc: #ef4444; --mut: #94a3b8; --border: #334155; }
        body { background: var(--bg); color: var(--txt); font-family: 'Tajawal', sans-serif; margin: 0; padding: 20px; }
        .dashboard { display: grid; grid-template-columns: 1fr 1.2fr; gap: 20px; max-width: 1400px; margin: auto; }
        @media (max-width: 900px) { .dashboard { grid-template-columns: 1fr; } }
        
        .panel { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
        .panel h2 { color: var(--pri); margin-top: 0; border-bottom: 2px dashed var(--border); padding-bottom: 10px; font-size: 20px;}
        .section-divider { border-top: 1px solid var(--border); margin: 20px 0; padding-top: 15px; }
        
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 13px; color: var(--mut); }
        .input-group input, .input-group select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: white; font-family: inherit; box-sizing: border-box; }
        
        button { background: var(--pri); color: #000; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-family: inherit; cursor: pointer; width: 100%; font-size: 15px; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        .btn-wa { background: #25D366; color: white; margin-top: 15px; }
        .btn-secondary { background: #1877F2; color: white; }
        
        /* شبكة الإكسسوارات */
        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-bottom: 15px; max-height: 300px; overflow-y: auto; padding-right: 5px;}
        .item-card { background: var(--bg); border: 1px solid var(--border); padding: 10px; border-radius: 8px; text-align: center; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; justify-content: space-between;}
        .item-card:hover { border-color: var(--pri); background: #172033; }
        .item-name { font-size: 13px; font-weight: bold; margin-bottom: 5px; color: white;}
        .item-price { color: var(--pri); font-size: 14px; font-weight: 900;}
        .item-stock { font-size: 11px; margin-top: 5px; font-weight: bold; padding: 3px; border-radius: 4px;}
        .stock-in { color: #10b981; background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981;}
        .stock-out { color: var(--acc); background: rgba(239, 68, 68, 0.1); border: 1px solid var(--acc);}

        /* سلة المبيعات */
        .cart-box { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; min-height: 80px; margin-bottom: 15px; }
        .cart-item { display: flex; justify-content: space-between; font-size: 13px; border-bottom: 1px dashed var(--border); padding: 5px 0; }
        .totals-box { display: flex; justify-content: space-between; background: #020617; padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 15px; }
        .totals-box div { text-align: center; }
        .totals-box h4 { margin: 0 0 5px 0; color: var(--mut); font-size: 12px; }
        .totals-box h3 { margin: 0; color: white; font-size: 16px;}

        /* إعدادات الطباعة للملصقات 40x25 ملم - مخصصة لـ Edge والطابعات الحرارية */
        @media print {
            @page { 
                size: 40mm 25mm portrait !important; 
                margin: 0 !important; 
                padding: 0 !important; 
            }
            html, body { 
                width: 40mm; height: 25mm; 
                margin: 0; padding: 0; 
                background: white; 
            }
            .dashboard { display: none !important; } 
            #printArea { display: block !important; width: 40mm; margin: 0; padding: 0; }
            
            .real-label { 
                width: 40mm; height: 25mm; 
                padding: 1.5mm 2mm; /* مسافة أمان للحواف */
                box-sizing: border-box; 
                display: flex; flex-direction: column; justify-content: space-between; 
                page-break-inside: avoid; page-break-after: always; 
                font-family: 'Tajawal', sans-serif; background: white; color: black; overflow: hidden;
            }
            .header-container { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #000; padding-bottom: 1px; margin-bottom: 1px;}
            
            /* تكبير اللوجو */
            .logo-img { max-height: 12px; width: auto; } 
            
            .order-txt { font-size: 8px; font-weight: 900;} 
            .client-name { font-size: 11px; font-weight: 900; text-align: center; margin: 1px 0; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;} 
            .client-phone { font-size: 9px; font-weight: bold; text-align: center; margin-bottom: 1px;}
            
            /* ستايل المربع الأسود لجهاز الصيانة */
            .device-box { font-size: 10px; border: 1px solid #000; padding: 1px 5px; display: inline-block; margin: 1px auto; font-weight: 900; background: #000; color: #fff; border-radius: 2px;}
            
            .footer-txt { font-size: 7px; text-align: center; font-weight: bold; margin-top: auto;}
            .warning-text { font-size: 7.5px; text-align: center; font-weight: bold; line-height: 1.2; padding: 1px;}
            
            /* ستايل الـ QR Code */
            .qr-code { width: 13mm; height: 13mm; object-fit: contain; margin: 1px auto; display: block; }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        
        <div class="panel">
            <h2>🖨️ إصدار الملصقات (Labels)</h2>
            
            <div class="input-group">
                <label>اسم العميل:</label>
                <input type="text" id="cName" placeholder="مثال: محمود محمد">
            </div>
            <div class="input-group">
                <label>رقم الموبايل:</label>
                <input type="tel" id="cPhone" placeholder="01XXXXXXXXX">
            </div>

            <div class="section-divider">
                <h3 style="margin-top: 0; font-size: 15px; color: var(--pri);">🔧 استلام صيانة</h3>
                <div class="input-group">
                    <label>عدد الأجهزة / الدراعات المستلمة:</label>
                    <input type="number" id="cCount" value="1" min="1">
                </div>
                <button onclick="printMaintenanceLabels()">🖨️ طباعة ملصقات الصيانة</button>
            </div>

            <div class="section-divider">
                <h3 style="margin-top: 0; font-size: 15px; color: #1877F2;">🎮 طباعة QR ألعاب وعروض</h3>
                <div class="input-group">
                    <label>نوع الطلب:</label>
                    <select id="gameType">
                        <option value="mod">تهكير PS4/PS3 (QR Code)</option>
                        <option value="sale">عروض أصلية (QR Code)</option>
                    </select>
                </div>
                <button class="btn-secondary" onclick="printGameLabels()">🖨️ طباعة ملصق الـ QR للعميل</button>
            </div>
        </div>

        <div class="panel">
            <h2>🛒 تسليم ومبيعات (Checkout)</h2>
            
            <div style="display: flex; gap: 10px;">
                <div class="input-group" style="flex: 1;">
                    <label>مصنعية الصيانة (إيراد):</label>
                    <input type="number" id="maintRev" value="0" oninput="calcTotals()">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>تكلفة الصيانة (اختياري):</label>
                    <input type="number" id="maintCost" value="0" oninput="calcTotals()">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>الصنايعي:</label>
                    <select id="technician">
                        <option value="محمود شوقي">محمود شوقي</option>
                        <option value="احمد يسري">احمد يسري</option>
                        <option value="عمر ياسر">عمر ياسر</option>
                    </select>
                </div>
            </div>

            <h4 style="margin: 0 0 10px; color: var(--pri);">📦 إضافة إكسسوارات:</h4>
            <div class="items-grid" id="accessoriesGrid"></div>

            <div class="cart-box" id="posCartList">
                <p style="text-align:center; color:gray; font-size:12px; margin-top:25px;">لم يتم إضافة إكسسوارات الفاتورة</p>
            </div>

            <div class="totals-box">
                <div><h4>الصيانة</h4><h3 id="tMaint">0 ج</h3></div>
                <div><h4>المشتريات</h4><h3 id="tGoods">0 ج</h3></div>
                <div><h4 style="color:var(--pri);">المطلوب من العميل</h4><h3 style="color:var(--pri);" id="tFinal">0 ج</h3></div>
            </div>

            <button class="btn-wa" onclick="checkout()">✅ تسليم وإرسال واتساب (وتسجيل بالشيت)</button>
        </div>
    </div>

    <div id="printArea"></div>

    <script>
        const GOOGLE_URL = 'https://script.google.com/macros/s/AKfycby4lxPshR2nUQ7BmSuPLY5XJ0_0n9PSPfu2LulXbVkq-G67WcrrFjAtEAN-Vd6n3WD1/exec';

        // 📦 قاعدة البيانات المحدثة بناءً على طلبك (تستخدم في حالة عدم الاتصال بالشيت أو جرد وهمي)
        let accessoriesDB = [
            { name: "جراب 4", price: 150, cost: 0, qty: 100 },
            { name: "جراب 5", price: 150, cost: 0, qty: 100 },
            { name: "جريبس اشكال", price: 30, cost: 0, qty: 100 },
            { name: "جريبس كارتون", price: 30, cost: 0, qty: 100 },
            { name: "دراع 2", price: 180, cost: 0, qty: 100 },
            { name: "دراع 3 اسود", price: 300, cost: 0, qty: 100 },
            { name: "دراع 3 اسود ألوان", price: 350, cost: 0, qty: 100 },
            { name: "دراع اصلي 4 امريكي", price: 100, cost: 0, qty: 100 },
            { name: "دراع اصلي 4 اوروبي", price: 800, cost: 0, qty: 100 },
            { name: "دراع اصلي 4 برو", price: 1300, cost: 0, qty: 100 },
            { name: "دراع كوبي 4 جديد اول", price: 750, cost: 0, qty: 100 },
            { name: "دراع كوبي 4 جديد ثاني", price: 650, cost: 0, qty: 100 },
            { name: "دراع كوبي 4 استعمال", price: 450, cost: 0, qty: 100 },
            { name: "دراع اصلي 5 استعمال", price: 2300, cost: 0, qty: 100 },
            { name: "دراع اصلي 5 جديد", price: 3850, cost: 0, qty: 100 },
            { name: "ستاند شحن 4", price: 250, cost: 0, qty: 100 },
            { name: "ستاند شحن 5", price: 550, cost: 0, qty: 100 },
            { name: "سكبن برو", price: 200, cost: 0, qty: 100 },
            { name: "سكين سليم", price: 200, cost: 0, qty: 100 },
            { name: "سكين فات", price: 200, cost: 0, qty: 100 },
            { name: "شاحن 8 مخرج", price: 550, cost: 0, qty: 100 },
            { name: "شنطه", price: 500, cost: 0, qty: 100 },
            { name: "كابل 5", price: 200, cost: 0, qty: 100 },
            { name: "كابل بوار", price: 100, cost: 0, qty: 100 },
            { name: "كابل شحن 3", price: 70, cost: 0, qty: 100 },
            { name: "كابل شحن 4 اصلي", price: 150, cost: 0, qty: 100 },
            { name: "كابل شحن 4 كوبي", price: 50, cost: 0, qty: 100 },
            { name: "كابل av", price: 50, cost: 0, qty: 100 },
            { name: "كابل hdmi", price: 120, cost: 0, qty: 100 }
        ];
        
        let posCart = [];

        // محاولة جلب الجرد الحقيقي من الشيت، لو فشل هيستخدم القائمة اللي فوق
        fetch(GOOGLE_URL)
            .then(res => res.json())
            .then(data => {
                if(data && data.length > 0 && !data.error) {
                    accessoriesDB = data; // تحديث بالبيانات الحية
                }
                renderAccessories();
            }).catch(err => {
                console.log("استخدام الجرد المحلي");
                renderAccessories();
            });

        function generateOrderNumber() { return '#' + Math.floor(1000 + Math.random() * 9000); }
        function getDates() {
            const today = new Date();
            const dateStr = today.toLocaleDateString('en-GB');
            const nextWeek = new Date(today); 
            nextWeek.setDate(today.getDate() + 7);
            const nextWeekStr = nextWeek.toLocaleDateString('en-GB');
            return { today: dateStr, nextWeek: nextWeekStr };
        }

        // رسم شبكة البضاعة
        function renderAccessories() {
            const grid = document.getElementById('accessoriesGrid');
            grid.innerHTML = '';
            accessoriesDB.forEach((item, index) => {
                let stockClass = item.qty > 0 ? 'stock-in' : 'stock-out';
                let stockText = item.qty > 0 ? `متاح: ${item.qty}` : `نفذت (${item.qty})`;
                
                grid.innerHTML += `
                    <div class="item-card" onclick="addToCart(${index})">
                        <div class="item-name">${item.name}</div>
                        <div class="item-price">${item.price} ج</div>
                        <div class="item-stock ${stockClass}">${stockText}</div>
                    </div>
                `;
            });
        }

        // الخصم الوهمي والإضافة للسلة
        function addToCart(index) {
            let item = accessoriesDB[index];
            let existing = posCart.find(c => c.name === item.name);
            if(existing) { existing.qty += 1; } 
            else { posCart.push({ name: item.name, price: item.price, cost: item.cost, qty: 1 }); }
            
            item.qty -= 1; 
            renderAccessories();
            renderCart();
        }

        function removeFromCart(index) {
            let removedItem = posCart[index];
            let dbItem = accessoriesDB.find(i => i.name === removedItem.name);
            if(dbItem) dbItem.qty += removedItem.qty; 
            
            posCart.splice(index, 1);
            renderAccessories();
            renderCart();
        }

        function renderCart() {
            const list = document.getElementById('posCartList');
            if(posCart.length === 0) { list.innerHTML = '<p style="text-align:center; color:gray; font-size:12px; margin-top:25px;">لم يتم إضافة إكسسوارات الفاتورة</p>'; } 
            else {
                list.innerHTML = '';
                posCart.forEach((c, index) => {
                    list.innerHTML += `<div class="cart-item">
                        <span style="color: white;">${c.name} (x${c.qty})</span>
                        <span>
                            <span style="color:var(--pri); font-weight:bold;">${c.price * c.qty} ج</span>
                            <span style="cursor:pointer; color:var(--acc); margin-right:10px; font-weight:bold;" onclick="removeFromCart(${index})">✖</span>
                        </span>
                    </div>`;
                });
            }
            calcTotals();
        }

        function calcTotals() {
            let mRev = parseFloat(document.getElementById('maintRev').value) || 0;
            let gRev = 0;
            posCart.forEach(c => { gRev += (c.price * c.qty); });

            document.getElementById('tMaint').innerText = mRev + " ج";
            document.getElementById('tGoods').innerText = gRev + " ج";
            document.getElementById('tFinal').innerText = (mRev + gRev) + " ج";
        }

        // 🖨️ طباعة ملصقات الصيانة
        function printMaintenanceLabels() {
            const name = document.getElementById('cName').value.trim();
            const phone = document.getElementById('cPhone').value.trim();
            const count = parseInt(document.getElementById('cCount').value);
            if(!name) return alert("يرجى إدخال اسم العميل أولاً.");

            const orderId = generateOrderNumber();
            const dates = getDates();
            const pa = document.getElementById('printArea');
            pa.innerHTML = '';

            // 1. الأجهزة
            for(let i = 1; i <= count; i++) {
                pa.innerHTML += `
                <div class="real-label">
                    <div class="header-container">
                        <img src="lvlup.png" class="logo-img" onerror="this.outerHTML='<span style=\\'font-weight:900; font-size:10px;\\'>Level UP</span>'">
                        <span class="order-txt">${orderId}</span>
                    </div>
                    <div class="client-name">${name}</div>
                    <div class="client-phone">${phone}</div>
                    <div style="text-align:center;"><span class="device-box">جهاز ${i} من ${count}</span></div>
                    <div class="footer-txt">${dates.today}</div>
                </div>`;
            }
            
            // 2. إيصال الاستلام
            pa.innerHTML += `
            <div class="real-label">
                <div class="header-container">
                    <img src="lvlup.png" class="logo-img" onerror="this.outerHTML='<span style=\\'font-weight:900; font-size:10px;\\'>Level UP</span>'">
                    <span class="order-txt">${orderId}</span>
                </div>
                <div class="client-name">${name}</div>
                <div class="client-phone">إيصال استلام</div>
                <div style="text-align:center;"><span class="device-box">عدد: ${count} أجهزة</span></div>
                <div class="footer-txt">${dates.today}</div>
            </div>`;
            
            // 3. التحذير
            pa.innerHTML += `
            <div class="real-label">
                <div class="header-container" style="justify-content:center; border:none;">
                    <img src="lvlup.png" class="logo-img" onerror="this.outerHTML='<span style=\\'font-weight:900; font-size:10px;\\'>Level UP</span>'">
                </div>
                <div class="warning-text">غير مسؤولين عن الأجهزة<br>لأكثر من أسبوع من الاستلام<br>(أقصى موعد: ${dates.nextWeek})</div>
                <div class="footer-txt">الأوردر: ${orderId}</div>
            </div>`;
            
            window.print();
        }

        // 🖨️ طباعة ملصقات الـ QR Code (للتهكير أو العروض)
        function printGameLabels() {
            const name = document.getElementById('cName').value.trim();
            const type = document.getElementById('gameType').value;
            if(!name) return alert("يرجى إدخال اسم العميل أولاً.");

            const orderId = generateOrderNumber(); 
            const dates = getDates();
            
            let qrSrc = type === 'mod' ? 'mod.png' : 'sale.png';
            let title = type === 'mod' ? 'لألعاب التهكير' : 'لعروض الألعاب';

            const pa = document.getElementById('printArea');
            pa.innerHTML = `
            <div class="real-label">
                <div class="header-container" style="justify-content: center; border-bottom: none; margin-bottom:0;">
                    <img src="lvlup.png" class="logo-img" onerror="this.outerHTML='<span style=\\'font-weight:900; font-size:10px;\\'>Level UP</span>'">
                </div>
                <img src="${qrSrc}" class="qr-code" alt="QR">
                <div style="font-size: 8px; text-align: center; font-weight: bold; margin-top:2px;">امسح الكود ${title}</div>
                <div class="footer-txt">${dates.today} | ${orderId}</div>
            </div>`;
            
            window.print();
        }

        // ✅ إتمام التسليم
        function checkout() {
            const nm = document.getElementById('cName').value.trim();
            const ph = document.getElementById('cPhone').value.trim() || "غير مسجل";
            if(!nm) return alert("يرجى إدخال اسم العميل في قسم الاستلام أولاً.");

            let mRev = parseFloat(document.getElementById('maintRev').value) || 0;
            let mCost = parseFloat(document.getElementById('maintCost').value) || 0;
            let tech = document.getElementById('technician').value;
            
            let gRev = 0, gCost = 0, gTxt = "", itemsForInventory = [];
            posCart.forEach(c => {
                gRev += (c.price * c.qty);
                gCost += (c.cost * c.qty); // لو الكوست 0 هيتحسب 0 عادي
                gTxt += `- ${c.name} (x${c.qty})\n`;
                itemsForInventory.push({ name: c.name, qty: c.qty });
            });

            let totalFinal = mRev + gRev;
            if(totalFinal === 0) return alert("الفاتورة فارغة! أضف سعر صيانة أو اختر مشتريات.");
            
            const currentOrderId = generateOrderNumber();

            // إرسال لجوجل شيت
            fetch(GOOGLE_URL, {
                method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    systemType: "Maintenance",
                    orderId: currentOrderId, name: nm, phone: ph, technician: tech,
                    maintRevenue: mRev, maintCost: mCost,
                    goodsRevenue: gRev, goodsCost: gCost,
                    purchasesDetails: gTxt || "لا يوجد",
                    purchasedItems: itemsForInventory
                })
            }).catch(e => console.log(e));

            // إرسال للواتساب
            let waTxt = `مرحباً بك في Level UP 🎮\nعزيزي ${nm}، تم بحمد الله الانتهاء من أجهزتك.\n\n`;
            waTxt += `🧾 *تفاصيل الفاتورة (${currentOrderId}):*\n`;
            if(mRev > 0) waTxt += `🔧 الصيانة: ${mRev} ج\n`;
            if(posCart.length > 0) waTxt += `🛍️ المشتريات:\n${gTxt}\n`;
            waTxt += `\n💰 *الإجمالي المطلوب:* ${totalFinal} جنيه.\n\nنتشرف بزيارتك دائماً!`;

            alert("تم التسجيل والخصم من الجرد بنجاح! جاري تحويلك للواتساب...");
            if(ph !== "غير مسجل") {
                window.open(`https://wa.me/2${ph}?text=${encodeURIComponent(waTxt)}`, '_blank');
            }
            
            setTimeout(() => { window.location.reload(); }, 1500);
        }
    </script>
</body>
</html>
