<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level UP - لوحة تحكم المحل (POS)</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --pri: #f59e0b; --txt: #f8fafc; --acc: #ef4444; --mut: #94a3b8; --border: #334155; }
        body { background: var(--bg); color: var(--txt); font-family: 'Tajawal', sans-serif; margin: 0; padding: 20px; }
        .dashboard { display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px; max-width: 1400px; margin: auto; }
        @media (max-width: 900px) { .dashboard { grid-template-columns: 1fr; } }
        
        .panel { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
        .panel h2 { color: var(--pri); margin-top: 0; border-bottom: 2px dashed var(--border); padding-bottom: 10px; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 14px; color: var(--mut); }
        .input-group input, .input-group select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: white; font-family: inherit; box-sizing: border-box; }
        
        button { background: var(--pri); color: #000; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-family: inherit; cursor: pointer; width: 100%; font-size: 15px; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        .btn-wa { background: #25D366; color: white; margin-top: 15px; }
        .btn-qr { background: #1877F2; color: white; margin-top: 10px; }
        
        /* شبكة الإكسسوارات */
        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-bottom: 15px; max-height: 400px; overflow-y: auto; padding-right: 5px;}
        .item-card { background: var(--bg); border: 1px solid var(--border); padding: 10px; border-radius: 8px; text-align: center; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; justify-content: space-between;}
        .item-card:hover { border-color: var(--pri); background: #172033; }
        .item-name { font-size: 13px; font-weight: bold; margin-bottom: 5px; line-height: 1.4;}
        .item-price { color: var(--pri); font-size: 14px; font-weight: bold; margin-bottom: 5px;}
        .item-stock { font-size: 11px; padding: 2px 5px; border-radius: 4px; background: rgba(0,0,0,0.5);}

        /* سلة المبيعات */
        .cart-box { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; min-height: 100px; margin-bottom: 15px; }
        .cart-item { display: flex; justify-content: space-between; font-size: 13px; border-bottom: 1px dashed var(--border); padding: 5px 0; }
        .cart-item span:first-child { color: var(--txt); }
        .totals-box { display: flex; justify-content: space-between; background: #020617; padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 15px; }
        .totals-box div { text-align: center; }
        .totals-box h4 { margin: 0 0 5px 0; color: var(--mut); font-size: 12px; }
        .totals-box h3 { margin: 0; color: white; }

        /* 🖨️ إعدادات الطباعة الدقيقة لمنع إهدار الورق (40x25 ملم) */
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            @page { size: 40mm 25mm; margin: 0mm !important; }
            body, html { margin: 0 !important; padding: 0 !important; background: white; }
            #printArea { position: absolute; left: 0; top: 0; width: 40mm; margin: 0; padding: 0; }
            
            .real-label { 
                width: 40mm; height: 24.5mm; /* تم التقليل نصف ملم لمنع رمي ورقة بيضاء */
                box-sizing: border-box; padding: 1mm; 
                display: flex; flex-direction: column; justify-content: space-between; align-items: center;
                page-break-after: always; page-break-inside: avoid;
                font-family: 'Tajawal', sans-serif; color: black; overflow: hidden;
            }
            .real-label:last-child { page-break-after: auto; } /* يمنع الورقة البيضاء في النهاية */

            .real-label .l-header { width: 100%; display: flex; justify-content: space-between; border-bottom: 1px solid #000; padding-bottom: 1px; }
            .real-label .l-logo { font-size: 8px; font-weight: 900; line-height: 1; }
            .real-label .l-order { font-size: 7px; font-weight: bold; line-height: 1; }
            
            .real-label .l-name { font-size: 11px; font-weight: bold; margin: 1px 0; text-align: center; line-height: 1.2; width: 100%; white-space: nowrap; overflow: hidden; }
            
            /* تعديل خط التليفون ليكون عريض ونوع مختلف */
            .real-label .l-phone { 
                font-size: 9px; 
                text-align: center; 
                line-height: 1; 
                font-family: Arial, Helvetica, sans-serif; 
                font-weight: 900; 
                margin-bottom: 1px;
            }
            
            .real-label .l-device { font-size: 9px; border: 1px solid #000; padding: 1px 4px; font-weight: bold; border-radius: 2px; line-height: 1.2; }
            .real-label .l-date { font-size: 6px; width: 100%; text-align: left; }
            .real-label .warning-text { font-size: 7.5px; text-align: center; font-weight: bold; line-height: 1.3; }

            /* تصميم ليبل الـ QR Code */
            .qr-label { justify-content: center; text-align: center; padding: 1mm; }
            .qr-img { width: 12mm; height: 12mm; margin: 1px auto; }
            .qr-txt { font-size: 7px; font-weight: bold; line-height: 1.1; }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="panel">
            <h2>📥 استلام وطباعة (Labels)</h2>
            <div class="input-group">
                <label>اسم العميل:</label>
                <input type="text" id="cName" placeholder="مثال: محمود شوقي">
            </div>
            <div class="input-group">
                <label>رقم الموبايل:</label>
                <input type="tel" id="cPhone" placeholder="01XXXXXXXXX">
            </div>
            
            <div style="border: 1px dashed var(--border); padding: 10px; border-radius: 8px; margin-bottom: 15px;">
                <h4 style="margin: 0 0 10px; color: var(--pri);">1. طباعة أجهزة الصيانة</h4>
                <div class="input-group" style="margin-bottom: 10px;">
                    <label>عدد الأجهزة / الدراعات المستلمة:</label>
                    <input type="number" id="cCount" value="1" min="1">
                </div>
                <button onclick="printLabels()">🖨️ طباعة ملصقات الصيانة</button>
            </div>

            <div style="border: 1px dashed var(--border); padding: 10px; border-radius: 8px;">
                <h4 style="margin: 0 0 10px; color: #1877F2;">2. طباعة ملصق الألعاب (QR Code)</h4>
                <div class="input-group" style="margin-bottom: 10px;">
                    <label>نوع الجهاز المطلوب تهكيره:</label>
                    <select id="qrConsole">
                        <option value="PS4">ألعاب تهكير PS4 (bit.ly/4mops4)</option>
                        <option value="PS3">ألعاب تهكير PS3 (bit.ly/3mops3)</option>
                    </select>
                </div>
                <button class="btn-qr" onclick="printQRLabel()">🖨️ طباعة ملصق الألعاب والـ QR</button>
            </div>
        </div>

        <div class="panel">
            <h2>🛒 تسليم ومبيعات (Checkout)</h2>
            
            <div style="display: flex; gap: 10px;">
                <div class="input-group" style="flex: 1;">
                    <label>مصنعية الصيانة (بيع):</label>
                    <input type="number" id="maintRev" value="0" oninput="calcTotals()">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>تكلفة الصيانة (اختياري):</label>
                    <input type="number" id="maintCost" value="0" oninput="calcTotals()">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>الصنايعي:</label>
                    <select id="technician">
                        <option value="احمد يسري">احمد يسري</option>
                        <option value="محمود شوقي">محمود شوقي</option>
                        <option value="عمر ياسر">عمر ياسر</option>
                    </select>
                </div>
            </div>

            <h4 style="margin: 0 0 10px; color: var(--pri);">إضافة إكسسوارات (من الجرد):</h4>
            <div class="items-grid" id="accessoriesGrid"></div>

            <div class="cart-box" id="posCartList">
                <p style="text-align:center; color:gray; font-size:12px; margin-top: 30px;">لم يتم إضافة إكسسوارات</p>
            </div>

            <div class="totals-box">
                <div><h4>إجمالي الصيانة</h4><h3 id="tMaint">0 ج</h3></div>
                <div><h4>إجمالي المشتريات</h4><h3 id="tGoods">0 ج</h3></div>
                <div><h4 style="color:var(--pri);">المطلوب من العميل</h4><h3 style="color:var(--pri);" id="tFinal">0 ج</h3></div>
            </div>

            <button class="btn-wa" onclick="checkout()">✅ تسليم وإرسال واتساب (وحفظ بالشيت)</button>
        </div>
    </div>

    <div id="printArea"></div>

    <script>
        // رابط جوجل شيت
        const GOOGLE_URL = 'https://script.google.com/macros/s/AKfycby8JKZI6cKEMpT3tfJXoE5mYP8uomUgHz_bc1q5mlw63yd2u2cn0hs6jnzf2gljhr486u3dkgm2y/exec';

        // 📦 قاعدة بيانات البضاعة (تم تصفير الكميات كما طلبت مع وضع أسعار)
        const accessoriesDB = [
            { id: 1, name: "دراع كوبي 4", price: 600, cost: 0, stock: 0 },
            { id: 2, name: "دراع كوبي 4 استعمال", price: 400, cost: 0, stock: 0 },
            { id: 3, name: "دراع اصلي 4", price: 1200, cost: 0, stock: 0 },
            { id: 4, name: "دراع اصلي 5", price: 3500, cost: 0, stock: 0 },
            { id: 5, name: "دراع 3", price: 350, cost: 0, stock: 0 },
            { id: 6, name: "جراب 4", price: 50, cost: 0, stock: 0 },
            { id: 7, name: "جراب 5", price: 100, cost: 0, stock: 0 },
            { id: 8, name: "جريبس اشكال", price: 20, cost: 0, stock: 0 },
            { id: 9, name: "جريبس كارتون", price: 30, cost: 0, stock: 0 },
            { id: 10, name: "كابل شحن 3", price: 50, cost: 0, stock: 0 },
            { id: 11, name: "كابل شحن 4 كوبي", price: 50, cost: 0, stock: 0 },
            { id: 12, name: "كابل شحن 4 اصلي", price: 150, cost: 0, stock: 0 },
            { id: 13, name: "كابل بوار", price: 50, cost: 0, stock: 0 },
            { id: 14, name: "hdmi كابل", price: 80, cost: 0, stock: 0 },
            { id: 15, name: "شنطه", price: 250, cost: 0, stock: 0 },
            { id: 16, name: "سكين فات", price: 100, cost: 0, stock: 0 },
            { id: 17, name: "سكين برو", price: 100, cost: 0, stock: 0 },
            { id: 18, name: "سكين سليم", price: 100, cost: 0, stock: 0 },
            { id: 19, name: "ستاند شحن 4", price: 250, cost: 0, stock: 0 },
            { id: 20, name: "ستاند شحن 5", price: 350, cost: 0, stock: 0 },
            { id: 21, name: "دراع 2", price: 150, cost: 0, stock: 0 },
            { id: 22, name: "av كابل", price: 50, cost: 0, stock: 0 },
            { id: 23, name: "كابل 5", price: 150, cost: 0, stock: 0 },
            { id: 24, name: "شاحن 8 مخرج", price: 200, cost: 0, stock: 0 }
        ];

        let posCart = [];
        const orderIdStr = '#' + Math.floor(1000 + Math.random() * 9000);
        
        const today = new Date();
        const dateStr = today.toLocaleDateString('en-GB');
        const nextWeek = new Date(today); 
        nextWeek.setDate(today.getDate() + 7);
        const nextWeekStr = nextWeek.toLocaleDateString('en-GB');

        // رسم البضاعة 
        const grid = document.getElementById('accessoriesGrid');
        accessoriesDB.forEach(item => {
            let isOutOfStock = item.stock <= 0;
            let stockColor = isOutOfStock ? 'var(--danger)' : 'var(--mut)';
            let stockText = isOutOfStock ? 'نفذت ⚠️ (متاح للبيع)' : `الكمية: ${item.stock}`;
            
            grid.innerHTML += `
                <div class="item-card" onclick="addToCart(${item.id})">
                    <div class="item-name">${item.name}</div>
                    <div class="item-price">${item.price} ج</div>
                    <div class="item-stock" style="color: ${stockColor}; border: 1px solid ${stockColor};">${stockText}</div>
                </div>
            `;
        });

        function addToCart(id) {
            let item = accessoriesDB.find(i => i.id === id);
            let existing = posCart.find(c => c.id === id);
            if(existing) { existing.qty += 1; } 
            else { posCart.push({ ...item, qty: 1 }); }
            renderCart();
        }

        function renderCart() {
            const list = document.getElementById('posCartList');
            if(posCart.length === 0) { list.innerHTML = '<p style="text-align:center; color:gray; font-size:12px; margin-top:30px;">لم يتم إضافة إكسسوارات</p>'; } 
            else {
                list.innerHTML = '';
                posCart.forEach((c, index) => {
                    list.innerHTML += `<div class="cart-item">
                        <span>${c.name} (x${c.qty})</span>
                        <span>
                            <span style="color:var(--pri); font-weight:bold;">${c.price * c.qty} ج</span>
                            <span style="cursor:pointer; color:var(--dang); margin-right:10px; font-size: 16px;" onclick="posCart.splice(${index},1); renderCart();">✖</span>
                        </span>
                    </div>`;
                });
            }
            calcTotals();
        }

        function calcTotals() {
            let mRev = parseFloat(document.getElementById('maintRev').value) || 0;
            let gRev = 0;
            posCart.forEach(c => { gRev += (c.price * c.qty); });
            document.getElementById('tMaint').innerText = mRev + " ج";
            document.getElementById('tGoods').innerText = gRev + " ج";
            document.getElementById('tFinal').innerText = (mRev + gRev) + " ج";
        }

        // 🖨️ طباعة ملصقات الصيانة العادية
        function printLabels() {
            const name = document.getElementById('cName').value.trim();
            const phone = document.getElementById('cPhone').value.trim();
            const count = parseInt(document.getElementById('cCount').value);
            if(!name || !phone) return alert("يرجى إدخال الاسم ورقم الموبايل أولاً.");

            const pa = document.getElementById('printArea');
            pa.innerHTML = '';

            for(let i = 1; i <= count; i++) {
                pa.innerHTML += `
                <div class="real-label">
                    <div class="l-header"><span class="l-logo">Level UP</span><span class="l-order">${orderIdStr}</span></div>
                    <div class="l-name">${name}</div>
                    <div class="l-phone">${phone}</div>
                    <div class="l-device">جهاز ${i} من ${count}</div>
                    <div class="l-date">${dateStr}</div>
                </div>`;
            }
            
            pa.innerHTML += `
            <div class="real-label">
                <div class="l-header"><span class="l-logo">Level UP</span><span class="l-order">${orderIdStr}</span></div>
                <div class="l-name">${name}</div>
                <div class="l-phone" style="font-size:9px;">إيصال استلام للعميل</div>
                <div class="l-device">عدد: ${count} أجهزة</div>
                <div class="l-date">${dateStr}</div>
            </div>`;
            
            pa.innerHTML += `
            <div class="real-label" style="justify-content: center;">
                <div class="l-header" style="justify-content:center; border:none;"><span class="l-logo" style="font-size:10px;">⚠️ Level UP ⚠️</span></div>
                <div class="warning-text">المحل غير مسؤول عن ترك<br>الأجهزة أكثر من أسبوع<br>(أقصى موعد: ${nextWeekStr})</div>
                <div class="l-order" style="margin-top: 2px;">الأوردر: ${orderIdStr}</div>
            </div>`;
            
            window.print();
        }

        // 🖨️ طباعة ملصق الـ QR للألعاب
        function printQRLabel() {
            const name = document.getElementById('cName').value.trim() || 'عميل Level UP';
            const phone = document.getElementById('cPhone').value.trim() || '01555886990';
            const consoleType = document.getElementById('qrConsole').value;
            
            let link = consoleType === 'PS4' ? 'bit.ly/4mops4' : 'bit.ly/3mops3';
            // توليد كود QR مجاني وسريع
            let qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=https://${link}`;

            const pa = document.getElementById('printArea');
            pa.innerHTML = `
            <div class="real-label qr-label">
                <div class="l-name" style="font-size: 13px;">${name}</div>
                <div class="l-phone">${phone}</div>
                <img src="${qrUrl}" class="qr-img">
                <div class="qr-txt">رابط اختيار ألعاب ${consoleType}</div>
                <div class="qr-txt" style="font-size: 8px;">${link}</div>
            </div>`;
            
            // مهلة نصف ثانية عشان صورة الـ QR تلحق تحمل من الإنترنت قبل ما الطابعة تسحب الورقة
            setTimeout(() => { window.print(); }, 500);
        }

        // إرسال وتسجيل العملية
        function checkout() {
            const nm = document.getElementById('cName').value.trim();
            const ph = document.getElementById('cPhone').value.trim();
            if(!nm || !ph) return alert("يرجى إدخال اسم العميل ورقم الموبايل في قسم الاستلام أولاً.");

            let mRev = parseFloat(document.getElementById('maintRev').value) || 0;
            let mCost = parseFloat(document.getElementById('maintCost').value) || 0;
            let tech = document.getElementById('technician').value;
            
            let gRev = 0, gCost = 0, gTxt = "", itemsForInventory = [];
            posCart.forEach(c => {
                gRev += (c.price * c.qty);
                gCost += (c.cost * c.qty);
                gTxt += `- ${c.name} (x${c.qty})\n`;
                itemsForInventory.push({ name: c.name, qty: c.qty });
            });

            let totalFinal = mRev + gRev;
            if(totalFinal === 0) return alert("الفاتورة فارغة! أضف صيانة أو مشتريات.");

            fetch(GOOGLE_URL, {
                method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    systemType: "Maintenance", orderId: orderIdStr, name: nm, phone: ph, technician: tech,
                    maintRevenue: mRev, maintCost: mCost, goodsRevenue: gRev, goodsCost: gCost,
                    purchasesDetails: gTxt || "لا يوجد", purchasedItems: itemsForInventory
                })
            }).catch(e => console.log(e));

            let waTxt = `مرحباً بك في Level UP 🎮\nعزيزي ${nm}، تم بحمد الله الانتهاء من أجهزتك.\n\n`;
            waTxt += `🧾 *تفاصيل الفاتورة (أوردر ${orderIdStr}):*\n`;
            if(mRev > 0) waTxt += `🔧 مصنعية الصيانة: ${mRev} ج\n`;
            if(posCart.length > 0) waTxt += `🛍️ المشتريات:\n${gTxt}\n`;
            waTxt += `\n💰 *الإجمالي المطلوب:* ${totalFinal} جنيه.\n\nنتشرف بزيارتك دائماً!`;

            alert("تم تسجيل العملية بنجاح! جاري تحويلك للواتساب...");
            window.open(`https://wa.me/2${ph}?text=${encodeURIComponent(waTxt)}`, '_blank');
            setTimeout(() => { window.location.reload(); }, 1500);
        }
    </script>
</body>
</html>
